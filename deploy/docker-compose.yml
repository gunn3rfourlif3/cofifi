# COFiFi — one self-contained stack on a VPS that is already busy.
#
# Fronted by the Caddy that already serves this box (container deploy-caddy-1,
# part of the PMS03 compose project). COFiFi joins that Caddy's network under
# the alias `cofifi-wp` and Caddy reverse-proxies to it by name — exactly how
# buddhapets-wp is wired. There is NO host port: nothing here binds a public
# or even a loopback interface, so the only way in is through Caddy.
#
# What it creates: two containers, two volumes, one private network, all
# prefixed "cofifi". What it never touches: ports 80 and 443, any other
# project's containers, volumes or config.
#
# Both services are capped on memory with rotating logs, so nothing here can
# starve or fill the box and take the other four projects down with it.
#
# Run ./preflight.sh first. Copy .env.example to .env and fill it in.

name: cofifi

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    # 384MB hard cap. InnoDB is told to stay well under it rather than sizing
    # its buffer pool from the host's total RAM, which is what it would
    # otherwise do — and on a shared box that number is a lie.
    command: >
      --innodb-buffer-pool-size=128M
      --max-connections=60
      --performance-schema=OFF
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 200
    logging: *logging
    # Private network only. The database is not reachable from Caddy's network.
    networks:
      - default
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  wordpress:
    # Pin the MAJOR line, not 'latest' — an unattended major upgrade of a live
    # shop is not something to find out about from a customer.
    #
    # A pin rots: WooCommerce raised its minimum to WordPress 7.0 while this
    # was on 6, and `wp plugin install woocommerce` refused with "does not work
    # with your version of WordPress". If that happens again, the plugin's
    # minimum has outrun the pin — bump the major here, don't downgrade Woo.
    #
    # AND NOTE: changing this tag alone does NOT upgrade an existing install.
    # The image seeds WordPress only into an empty volume; after that the tag
    # governs PHP and Apache and nothing else. The core files are upgraded by
    # `wp core update`, which first-run.sh does.
    image: wordpress:7-php8.4-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m
    memswap_limit: 512m
    pids_limit: 200
    logging: *logging
    networks:
      default:
      proxy:
        aliases:
          # What the Caddyfile block reverse_proxies to. Change one, change both.
          - cofifi-wp
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: cof_
      WORDPRESS_CONFIG_EXTRA: |
        /* Closed to the public until MAINTENANCE=false in .env.
           A constant beats the Customizer setting, so a database restore or a
           half-finished import can never leave the shop open by accident. */
        define( 'COFIFI_MAINTENANCE', ${MAINTENANCE} );

        define( 'WP_HOME', '${SITE_URL}' );
        define( 'WP_SITEURL', '${SITE_URL}' );

        /* Caddy terminates TLS and forwards plain HTTP. Without this WordPress
           writes http:// URLs and then redirect-loops. */
        if ( isset( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
            $$_SERVER['HTTPS'] = 'on';
        }

        define( 'DISALLOW_FILE_EDIT', true );
        define( 'WP_AUTO_UPDATE_CORE', 'minor' );
    volumes:
      - wp:/var/www/html
      # The theme is this git repo, checked out on the host. Deploying is a pull.
      - ../:/var/www/html/wp-content/themes/cofifi:ro

  # Not a long-running service — `docker compose run --rm cli wp <command>`.
  cli:
    image: wordpress:cli-php8.4
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    mem_limit: 256m
    logging: *logging
    networks:
      - default
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: cof_
    volumes:
      - wp:/var/www/html
      - ../:/var/www/html/wp-content/themes/cofifi:ro

networks:
  # Ours. Only cofifi containers are on it; this is where the database lives.
  default:

  # Caddy's. Created and owned by the PMS03 compose project — `external: true`
  # means we join it and never create or destroy it. Set PROXY_NETWORK in .env
  # if it is ever renamed.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-deploy_default}

volumes:
  db:
  wp:
